# ============================================================================
# КОНФИГУРАЦИЯ СИСТЕМЫ ТРЕНИРОВКИ
# ============================================================================
# Измените параметры ниже и перезапустите скрипт
# ============================================================================

# --- НАСТРОЙКИ CPU ---
cpu:
  # Процент используемых ядер (0.1 - 1.0)
  # WSL2: укажите exact_cores вместо usage_percent для стабильности
  usage_percent: 0.50
  
  # Или укажите точное количество ядер (если указано, игнорирует usage_percent)
  # ДЛЯ WSL2 РАСКОММЕНТИРУЙТЕ И УСТАНОВИТЕ ЗНАЧЕНИЕ СОГЛАСНО .wslconfig
  exact_cores: 4

# --- НАСТРОЙКИ RAM ---
ram:
  # Процент используемой оперативной памяти (0.1 - 0.9)
  usage_percent: 0.70
  
  # Жёсткий лимит RAM в GB (если указано, ограничивает максимум)
  # ДЛЯ WSL2 с 6GB оперативной памяти рекомендуется 4GB
  max_gb: 4.0

# --- НАСТРОЙКИ LightGBM ---
lightgbm:
  # Количество bins для гистограмм (WSL2 quicktest: 31, production: 255-512)
  max_bin: 10
  
  # Количество листьев в дереве (меньше = проще модель, меньше памяти)
  # WSL2 quicktest: 31, production: 127-255
  num_leaves: 10
  
  # Максимальная глубина дерева
  max_depth: 7
  
  # Минимум данных в листе (больше = меньше памяти)
  min_data_in_leaf: 100
  
  # Learning rate
  learning_rate: 0.05
  
  # Количество итераций (WSL2 quicktest: 50-100, production: 1000+)
  num_boost_round: 50
  
  # Early stopping
  early_stopping_rounds: 20

# --- НАСТРОЙКИ OPTUNA ---
optuna:
  # Количество trials для оптимизации
  # WSL2 quicktest: 1-2, production: 20-50
  n_trials: 1
  
  # Таймаут на trial в секундах (null = без ограничений)
  timeout_per_trial: null

# --- НАСТРОЙКИ FEATURE ENGINEERING ---
features:
  # Генерировать расширенный набор features (200+)
  extended: true
  
  # Периоды для скользящих средних
  sma_periods: [3, 5, 7, 10, 14, 20, 30, 50, 100, 200]
  
  # Периоды для RSI
  rsi_periods: [5, 7, 9, 14, 21, 28]

# --- НАСТРОЙКИ РИСК-МЕНЕДЖМЕНТА ---
risk:
  # Максимальное плечо
  max_leverage: 10.0
  
  # Максимальный размер позиции (% от портфеля)
  max_position_pct: 0.25
  
  # Пороги drawdown
  drawdown_warning: 0.05
  drawdown_critical: 0.10
  drawdown_emergency: 0.15
  
  # CVaR настройки
  cvar_confidence: 0.95
  cvar_window: 252
  cvar_max_threshold: 0.03
  
  # Kelly Criterion
  kelly_fraction: 0.25
  kelly_min: 0.01
  kelly_max: 0.50

# --- ПУТИ ---
paths:
  # Укажите относительные пути от директории проекта
  # На WSL2, Linux сервере и Windows все будут работать автоматически
  data: ../data
  models: ./models
  logs: ./logs
  cache: ./.cache

# --- ПРОЧЕЕ ---
misc:
  random_seed: 42
  # Максимум строк для обучения (для WSL2 quicktest: 50k, production: 2M+)
  max_samples: 25000
  # Максимум символов для обучения (для WSL2 quicktest: 5, production: 102)
  max_symbols: 5
  test_size: 0.20
  val_size: 0.10
