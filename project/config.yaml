# ============================================================================
# КОНФИГУРАЦИЯ СИСТЕМЫ ТРЕНИРОВКИ
# ============================================================================
# Измените параметры ниже и перезапустите скрипт
# ============================================================================

# --- НАСТРОЙКИ CPU ---
cpu:
  # Процент используемых ядер (0.1 - 1.0)
  # 1.0 = все 48 ядер, 0.75 = 36 ядер, 0.5 = 24 ядра
  usage_percent: 1.0
  
  # Или укажите точное количество ядер (если указано, игнорирует usage_percent)
  # exact_cores: 36

# --- НАСТРОЙКИ RAM ---
ram:
  # Процент используемой оперативной памяти (0.1 - 0.9)
  usage_percent: 0.92
  
  # Жёсткий лимит RAM в GB (если указано, ограничивает максимум)
  max_gb: 300

# --- НАСТРОЙКИ LightGBM ---
lightgbm:
  # Количество bins для гистограмм (больше = точнее, но больше RAM)
  # Рекомендуется: 255-512
  max_bin: 255
  
  # Количество листьев в дереве (больше = сложнее модель)
  # Рекомендуется: 31-255
  num_leaves: 127
  
  # Максимальная глубина дерева (-1 = без ограничений)
  max_depth: 12
  
  # Минимум данных в листе
  min_data_in_leaf: 20
  
  # Learning rate (выше = быстрее сходимость, но early stopping компенсирует)
  learning_rate: 0.05
  
  # Количество итераций (early stopping остановит раньше)
  num_boost_round: 1000
  
  # Early stopping (быстрее остановка = быстрее прогон)
  early_stopping_rounds: 50

# --- НАСТРОЙКИ OPTUNA ---
optuna:
  # Количество trials для оптимизации
  # 20 trials достаточно для хороших параметров, 50 — diminishing returns
  n_trials: 20
  
  # Таймаут на trial в секундах (null = без ограничений)
  timeout_per_trial: null

# --- НАСТРОЙКИ FEATURE ENGINEERING ---
features:
  # Генерировать расширенный набор features (200+)
  extended: true
  
  # Периоды для скользящих средних
  sma_periods: [3, 5, 7, 10, 14, 20, 30, 50, 100, 200]
  
  # Периоды для RSI
  rsi_periods: [5, 7, 9, 14, 21, 28]

# --- НАСТРОЙКИ РИСК-МЕНЕДЖМЕНТА ---
risk:
  # Максимальное плечо
  max_leverage: 10.0
  
  # Максимальный размер позиции (% от портфеля)
  max_position_pct: 0.25
  
  # Пороги drawdown
  drawdown_warning: 0.05
  drawdown_critical: 0.10
  drawdown_emergency: 0.15
  
  # CVaR настройки
  cvar_confidence: 0.95
  cvar_window: 252
  cvar_max_threshold: 0.03
  
  # Kelly Criterion
  kelly_fraction: 0.25
  kelly_min: 0.01
  kelly_max: 0.50

# --- ПУТИ ---
paths:
  data: /home/ai/NogutiAI/aiTrainCrypto/data
  models: /home/ai/NogutiAI/aiTrainCrypto/project/models
  logs: /home/ai/NogutiAI/aiTrainCrypto/project/logs
  cache: /home/ai/NogutiAI/aiTrainCrypto/project/.cache

# --- ПРОЧЕЕ ---
misc:
  random_seed: 42
  # Максимум строк для обучения (10M = оптимальный баланс скорость/качество)
  max_samples: 10_000_000
  test_size: 0.20
  val_size: 0.10
